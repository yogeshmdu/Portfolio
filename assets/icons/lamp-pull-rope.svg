<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 230" width="70" height="230" class="theme-rope-svg">
  <defs>
    <!-- Braided Rope Texture -->
    <pattern id="rope-braid" width="8" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(32)">
      <rect width="4" height="13" fill="#f8f5f0"/>
      <rect x="4" width="4" height="13" fill="#ded5c8"/>
      <line x1="0" y1="0" x2="8" y2="13" stroke="#b0a290" stroke-width="0.8"/>
      <line x1="0" y1="6.5" x2="8" y2="19.5" stroke="#8a7c6a" stroke-width="0.5" opacity="0.6"/>
    </pattern>
    <!-- Metallic Brass Ferrule Gradient -->
    <linearGradient id="brass-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a6316"/>
      <stop offset="22%" stop-color="#e8bf58"/>
      <stop offset="48%" stop-color="#fff4cb"/>
      <stop offset="76%" stop-color="#d4a332"/>
      <stop offset="100%" stop-color="#5a3d07"/>
    </linearGradient>
    <!-- Polished Mahogany Wood Grain Gradient -->
    <linearGradient id="wood-base-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#341303"/>
      <stop offset="18%" stop-color="#5c260c"/>
      <stop offset="45%" stop-color="#8a3e16"/>
      <stop offset="68%" stop-color="#6e2e0e"/>
      <stop offset="88%" stop-color="#471b06"/>
      <stop offset="100%" stop-color="#240b01"/>
    </linearGradient>
    <!-- Gloss Reflection Gradient -->
    <linearGradient id="gloss-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.65)"/>
      <stop offset="60%" stop-color="rgba(255, 255, 255, 0.25)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)"/>
    </linearGradient>
  </defs>

  <g id="rope-sway-assembly" class="rope-sway-assembly">
    <!-- Hanging Braided Cord -->
    <line x1="35" y1="0" x2="35" y2="152" stroke="url(#rope-braid)" stroke-width="5" stroke-linecap="square"/>
    <!-- Subtle Cord Outline Shading -->
    <line x1="32.5" y1="0" x2="32.5" y2="152" stroke="rgba(255,255,255,0.4)" stroke-width="0.8"/>
    <line x1="37.5" y1="0" x2="37.5" y2="152" stroke="rgba(90,75,60,0.35)" stroke-width="0.8"/>

    <!-- Brass Ferrule Collar Top Ring -->
    <rect x="29.5" y="150" width="11" height="2.5" rx="1" fill="url(#brass-grad)" stroke="#573e0a" stroke-width="0.4"/>
    <!-- Brass Ferrule Middle Barrel -->
    <rect x="30" y="152.5" width="10" height="4.5" fill="url(#brass-grad)" stroke="#573e0a" stroke-width="0.4"/>
    <!-- Brass Ferrule Bottom Lip -->
    <rect x="28.5" y="157" width="13" height="3" rx="1.2" fill="url(#brass-grad)" stroke="#573e0a" stroke-width="0.4"/>

    <!-- Polished Wooden Acorn Pull Knob -->
    <g class="rope-acorn-knob">
      <!-- Base Acorn Shape -->
      <path d="M 31 160 C 29 167, 20 173, 20 183 C 20 195, 27 202, 35 202 C 43 202, 50 195, 50 183 C 50 173, 41 167, 39 160 Z"
            fill="url(#wood-base-grad)" stroke="#220b02" stroke-width="0.7"/>

      <!-- Organic Wood Grain Lines -->
      <path d="M 32 163 C 30 171, 25 178, 25 186 C 25 194, 29 199, 33 201" fill="none" stroke="rgba(30, 8, 2, 0.45)" stroke-width="0.7"/>
      <path d="M 35 163 C 34 172, 32 181, 33 191 C 33.5 196, 35 200, 36 201.5" fill="none" stroke="rgba(30, 8, 2, 0.35)" stroke-width="0.6"/>
      <path d="M 37 163 C 39 171, 44 177, 44 186 C 44 194, 40 199, 37 201" fill="none" stroke="rgba(30, 8, 2, 0.4)" stroke-width="0.7"/>

      <!-- Gloss Specular Highlight (Ambient Light Catch) -->
      <path d="M 23.5 174 C 22.2 179, 22.8 187, 25.5 191 C 25 186, 24 179, 24.8 174 Z"
            fill="url(#gloss-grad)"/>
      <ellipse cx="25.5" cy="180" rx="1.6" ry="4" fill="rgba(255,255,255,0.6)" transform="rotate(-12 25.5 180)"/>
    </g>
  </g>
</svg>