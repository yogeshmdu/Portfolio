<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="apiHubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4B32"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="cyanNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="greenNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amberNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Connection Network Traces -->
  <path d="M64 42 L64 24" stroke="#94A3B8" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M46 75 L28 93" stroke="#94A3B8" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M82 75 L100 93" stroke="#94A3B8" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Service Nodes -->
  <circle cx="64" cy="20" r="11" fill="url(#cyanNode)"/>
  <circle cx="24" cy="98" r="11" fill="url(#greenNode)"/>
  <circle cx="104" cy="98" r="11" fill="url(#amberNode)"/>
  <!-- Central API Hub -->
  <circle cx="64" cy="64" r="23" fill="url(#apiHubGrad)"/>
  <text x="64" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">API</text>
</svg>
